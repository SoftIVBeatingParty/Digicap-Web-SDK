name: npm-publish

on:
  push:
    branches: [dev]

permissions:
  contents: read

concurrency:
  group: publish-dev
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          registry-url: https://registry.npmjs.org
          cache: npm

      - run: npm ci
      - run: npm run build

      # dev push ごとにユニークな pre-release version を付ける（コミット/タグは作らない）
      - name: Set prerelease version
        shell: bash
        run: |
          BASE=$(node -p "require('./package.json').version.split('-')[0]")
          SHORT_SHA=${GITHUB_SHA::7}
          npm version "${BASE}-dev.${GITHUB_RUN_NUMBER}+${SHORT_SHA}" --no-git-tag-version

      # npmjs に publish（scoped の場合は public 指定が必要）
      - run: npm publish --tag dev --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
